<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Debloat SEEK</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup" aria-labelledby="popup-title">
    <header class="hero">
      <div class="brand-mark" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="hero-copy">
        <div class="hero-title-row">
          <h1 id="popup-title">Debloat SEEK</h1>
        </div>
      </div>
      <a class="source-link" href="https://github.com/aloktripathi1/debloat-seek"
        target="_blank" rel="noopener noreferrer"
        aria-label="View Debloat SEEK source on GitHub" title="View source on GitHub">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
        </svg>
      </a>
    </header>

    <section class="settings-section appearance-section" aria-labelledby="appearance-heading">
      <div class="section-heading">
        <h2 id="appearance-heading">SEEK appearance</h2>
      </div>

      <div class="theme-control" role="radiogroup" aria-labelledby="appearance-heading">
        <button class="theme-option" type="button" role="radio" data-theme-option="system"
          aria-checked="true" tabindex="0">
          <span class="theme-swatch theme-swatch-system" aria-hidden="true"></span>
          <span>System</span>
        </button>
        <button class="theme-option" type="button" role="radio" data-theme-option="light"
          aria-checked="false" tabindex="-1">
          <span class="theme-swatch theme-swatch-light" aria-hidden="true"></span>
          <span>Light</span>
        </button>
        <button class="theme-option" type="button" role="radio" data-theme-option="dark"
          aria-checked="false" tabindex="-1">
          <span class="theme-swatch theme-swatch-dark" aria-hidden="true"></span>
          <span>Dark</span>
        </button>
        <button class="theme-option" type="button" role="radio" data-theme-option="black"
          aria-checked="false" tabindex="-1">
          <span class="theme-swatch theme-swatch-black" aria-hidden="true"></span>
          <span>Black</span>
        </button>
      </div>

    </section>

    <section class="settings-section" aria-labelledby="default-heading">
      <div class="section-heading">
        <h2 id="default-heading">Default cleanup</h2>
      </div>

      <label class="setting-row" for="setting-unit-nav">
        <span class="setting-copy">
          <span class="setting-title" id="unit-nav-title">Previous/Next navigation</span>
        </span>
        <span class="setting-control">
          <span class="state-label" data-state-for="unitNav" aria-hidden="true">On</span>
          <span class="switch">
            <input id="setting-unit-nav" type="checkbox" role="switch" data-setting="unitNav"
              aria-labelledby="unit-nav-title" checked>
            <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          </span>
        </span>
      </label>

      <label class="setting-row" for="setting-overview">
        <span class="setting-copy">
          <span class="setting-title" id="overview-title">Overview button</span>
        </span>
        <span class="setting-control">
          <span class="state-label" data-state-for="overview" aria-hidden="true">On</span>
          <span class="switch">
            <input id="setting-overview" type="checkbox" role="switch" data-setting="overview"
              aria-labelledby="overview-title" checked>
            <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          </span>
        </span>
      </label>

      <label class="setting-row" for="setting-divider">
        <span class="setting-copy">
          <span class="setting-title" id="divider-title">Target divider</span>
        </span>
        <span class="setting-control">
          <span class="state-label" data-state-for="divider" aria-hidden="true">On</span>
          <span class="switch">
            <input id="setting-divider" type="checkbox" role="switch" data-setting="divider"
              aria-labelledby="divider-title" checked>
            <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          </span>
        </span>
      </label>
    </section>

    <section class="settings-section" aria-labelledby="optional-heading">
      <div class="section-heading">
        <h2 id="optional-heading">Optional cleanup</h2>
      </div>

      <label class="setting-row" for="setting-header">
        <span class="setting-copy">
          <span class="setting-title" id="header-title">Course header bar</span>
        </span>
        <span class="setting-control">
          <span class="state-label" data-state-for="header" aria-hidden="true">Off</span>
          <span class="switch">
            <input id="setting-header" type="checkbox" role="switch" data-setting="header"
              aria-labelledby="header-title">
            <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          </span>
        </span>
      </label>

      <label class="setting-row" for="setting-transcript">
        <span class="setting-copy">
          <span class="setting-title" id="transcript-title">Video Transcript panel</span>
        </span>
        <span class="setting-control">
          <span class="state-label" data-state-for="transcript" aria-hidden="true">Off</span>
          <span class="switch">
            <input id="setting-transcript" type="checkbox" role="switch" data-setting="transcript"
              aria-labelledby="transcript-title">
            <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          </span>
        </span>
      </label>

      <label class="setting-row" for="setting-answers">
        <span class="setting-copy">
          <span class="setting-title" id="answers-title">Hide assignment answers</span>
        </span>
        <span class="setting-control">
          <span class="state-label" data-state-for="answers" aria-hidden="true">Off</span>
          <span class="switch">
            <input id="setting-answers" type="checkbox" role="switch" data-setting="answers"
              aria-labelledby="answers-title">
            <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          </span>
        </span>
      </label>

      <label class="setting-row" for="setting-objectives">
        <span class="setting-copy">
          <span class="setting-title" id="objectives-title">Objectives</span>
        </span>
        <span class="setting-control">
          <span class="state-label" data-state-for="objectives" aria-hidden="true">Off</span>
          <span class="switch">
            <input id="setting-objectives" type="checkbox" role="switch" data-setting="objectives"
              aria-labelledby="objectives-title">
            <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          </span>
        </span>
      </label>

      <label class="setting-row" for="setting-announcements">
        <span class="setting-copy">
          <span class="setting-title" id="announcements-title">Announcements</span>
        </span>
        <span class="setting-control">
          <span class="state-label" data-state-for="announcements" aria-hidden="true">Off</span>
          <span class="switch">
            <input id="setting-announcements" type="checkbox" role="switch" data-setting="announcements"
              aria-labelledby="announcements-title">
            <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          </span>
        </span>
      </label>

      <label class="setting-row" for="setting-forum">
        <span class="setting-copy">
          <span class="setting-title" id="forum-title">Forum</span>
        </span>
        <span class="setting-control">
          <span class="state-label" data-state-for="forum" aria-hidden="true">Off</span>
          <span class="switch">
            <input id="setting-forum" type="checkbox" role="switch" data-setting="forum"
              aria-labelledby="forum-title">
            <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          </span>
        </span>
      </label>

      <label class="setting-row" for="setting-calculator">
        <span class="setting-copy">
          <span class="setting-title" id="calculator-title">Calculator</span>
        </span>
        <span class="setting-control">
          <span class="state-label" data-state-for="calculator" aria-hidden="true">Off</span>
          <span class="switch">
            <input id="setting-calculator" type="checkbox" role="switch" data-setting="calculator"
              aria-labelledby="calculator-title">
            <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          </span>
        </span>
      </label>
    </section>

    <footer class="footer">
      <div class="footer-actions">
        <button id="restore-defaults" class="restore-button" type="button">Restore defaults</button>
        <span id="summary" class="summary" aria-hidden="true"></span>
      </div>
      <p id="status" class="status" data-tone="neutral" role="status" aria-live="polite">
        Loading settings…
      </p>
    </footer>
  </main>

  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
